<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070912" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flashy" />
    <title>Flashy</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 400;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #070912;
        padding-top: env(safe-area-inset-top, 0px);
        transition: opacity 240ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #splash.is-hiding { opacity: 0; }
      .splash-mark {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
          "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #f7f7fb;
      }
      @supports ((-webkit-background-clip: text) or (background-clip: text)) {
        .splash-mark {
          background-image: linear-gradient(115deg, #ff187f, #df12e8 38%, #8d22ff 68%, #ff6415);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true"><span class="splash-mark">Flashy</span></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
